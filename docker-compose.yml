version: '3.8'
services:
  app:
    build: .
    image: archivos_app:dev
    container_name: archivos_app
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=sistemadearchivo
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: nginx_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: sistemadearchivo
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
